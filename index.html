<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wolfborn — The First One</title>
<meta name="description" content="Ouça o álbum completo de Wolfborn — heavy rock e NWOBHM.">

<!-- Open Graph / WhatsApp / Facebook preview -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wolfborn">
<meta property="og:title" content="Wolfborn — The First One">
<meta property="og:description" content="Ouça o álbum completo de Wolfborn — heavy rock e NWOBHM.">
<meta property="og:url" content="https://ricardobmuller.github.io/Wolfborn/">
<meta property="og:image" content="https://ricardobmuller.github.io/Wolfborn/assets/cover.png">
<meta property="og:image:width" content="1254">
<meta property="og:image:height" content="1254">

<!-- Twitter card (harmless extra, some apps fall back to it) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wolfborn — The First One">
<meta name="twitter:description" content="Ouça o álbum completo de Wolfborn — heavy rock e NWOBHM.">
<meta name="twitter:image" content="https://ricardobmuller.github.io/Wolfborn/assets/cover.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wolfborn">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <img class="backdrop__image" src="assets/cover.png" alt="">
  <div class="backdrop__scrim"></div>
</div>

<div class="embers" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<button id="installBtn" class="install-btn" type="button" hidden aria-label="Instalar aplicativo Wolfborn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"></path>
    <path d="M7 10l5 5 5-5"></path>
    <path d="M5 19h14"></path>
  </svg>
  <span class="install-tip" id="installTip" hidden>Toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong></span>
</button>

<header class="hero-spacer">
  <h1 class="sr-only">Wolfborn — The First One</h1>
  <p class="sr-only">Capa do álbum: um lobo uiva para a lua cheia sobre um penhasco, com uma floresta em chamas e uma catedral gótica ao fundo.</p>
</header>

<div class="album-heading">
  <p class="eyebrow eyebrow--band">Wolfborn</p>
  <h2 class="album-title">The First One</h2>
</div>

<main class="album">
  <p class="eyebrow">Faixas</p>
  <ol class="tracklist" id="tracklist" aria-label="Faixas do álbum"></ol>
</main>

<footer class="transport" id="transport">
  <div class="transport__inner">

    <div class="transport__now">
      <p class="transport__title" id="nowPlayingTitle">Escolha uma faixa</p>
      <div class="transport__seek-row">
        <span class="transport__time" id="currentTime">0:00</span>
        <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" step="0.1" aria-label="Progresso da faixa" disabled>
        <span class="transport__time" id="duration">0:00</span>
      </div>
    </div>

    <div class="transport__controls">
      <button id="shuffleBtn" class="ctrl-btn ctrl-btn--toggle" aria-label="Ativar modo aleatório" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
      </button>
      <button id="prevBtn" class="ctrl-btn" aria-label="Faixa anterior" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h2v16H6V4zm3.5 8L20 4v16L9.5 12z"/></svg>
      </button>
      <button id="playBtn" class="ctrl-btn ctrl-btn--play" aria-label="Reproduzir" disabled>
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
      </button>
      <button id="nextBtn" class="ctrl-btn" aria-label="Próxima faixa" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 4h2v16h-2V4zM4.5 4L15 12 4.5 20V4z"/></svg>
      </button>
      <button id="repeatBtn" class="ctrl-btn ctrl-btn--toggle" aria-label="Ativar repetição" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span class="repeat-one-badge" id="repeatOneBadge" hidden>1</span>
      </button>
    </div>

    <div class="transport__volume">
      <svg viewBox="0 0 24 24" fill="currentColor" class="volume-icon"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12z"/></svg>
      <input type="range" id="volumeBar" class="volume-bar" min="0" max="100" value="80" aria-label="Volume">
    </div>

  </div>
</footer>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
